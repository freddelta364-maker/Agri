<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#camGrad)" />
  
  <!-- Cameroon Color Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#eab308" stroke-width="8" stroke-dasharray="16 10" opacity="0.6" />
  
  <!-- Sprout and Leaves (Agricultural heart) -->
  <path d="M256 390 V 220" stroke="#fef08a" stroke-width="18" stroke-linecap="round" />
  
  <!-- Left Leaf -->
  <path d="M256 280 C 180 280 140 210 170 160 C 220 160 250 210 256 260 Z" fill="url(#goldGrad)" />
  <!-- Right Leaf -->
  <path d="M256 230 C 330 220 370 150 330 110 C 280 120 260 170 256 210 Z" fill="#4ade80" />
  
  <!-- Star of Cameroon at Apex -->
  <polygon points="256,70 268,105 305,105 275,127 286,162 256,140 226,162 237,127 207,105 244,105" fill="url(#redGrad)" stroke="#fef08a" stroke-width="2" />
  
  <!-- Network Nodes / Link symbolizing connection between farmer and market -->
  <circle cx="160" cy="380" r="18" fill="#eab308" />
  <circle cx="352" cy="380" r="18" fill="#4ade80" />
  <circle cx="256" cy="400" r="22" fill="#ef4444" />
  <line x1="160" y1="380" x2="256" y2="400" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8" />
  <line x1="352" y1="380" x2="256" y2="400" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8" />
  <circle cx="256" cy="400" r="12" fill="#ffffff" />
</svg>
